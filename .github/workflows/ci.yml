name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1" # tests/support/pg.py fails instead of skipping when its database is unavailable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as replit.nix
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: npm ci # PGlite for the Postgres-backed tests
      - run: pip install -r requirements-dev.txt
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          # one process per file group: a single run of every PGlite test gets killed for memory (exit 143)
          rc=0
          for g in 'tests/test_[a-c]*.py' 'tests/test_[d-l]*.py' 'tests/test_[m-r]*.py' 'tests/test_[s-z]*.py'; do
            pytest -q -rs $g 2>&1 | tee -a pytest.out || rc=1
          done
          if [ $rc -ne 0 ]; then
            grep -E "^(E  |ERROR|FAILED|SKIPPED)" pytest.out | head -15 | while read -r l; do echo "::error::${l:0:200}"; done # annotations are readable without log access
            exit 1
          fi
      - run: node tests/schema_check.mjs
      - run: node tests/db_check.mjs
      - run: node tests/roles_check.mjs
      - run: pip-audit -r requirements.txt

  backend-pg:
    # the same tests against a real Postgres server (the PGlite job above is WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
