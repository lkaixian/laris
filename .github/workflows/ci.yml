name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1" # tests/support/pg.py fails instead of skipping when its database is unavailable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as replit.nix
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: npm ci # PGlite for the Postgres-backed tests
      - run: pip install -r requirements-dev.txt
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee pytest.out || {
            code=$?
            grep -E "^(E  |ERROR|FAILED|SKIPPED)" pytest.out | head -15 | while read -r l; do echo "::error::${l:0:200}"; done # annotations are readable without log access
            exit $code
          }
      - run: node tests/schema_check.mjs
      - run: node tests/db_check.mjs
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
