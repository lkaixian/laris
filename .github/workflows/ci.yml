name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # one runner per file group: they run in parallel, and no single process holds every PGlite test (that got killed for memory, exit 143)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ["a-c", "d-l", "m-r", "s-z"]
    env:
      CI: "1" # tests/support/pg.py fails instead of skipping when its database is unavailable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as replit.nix
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: npm ci # PGlite for the Postgres-backed tests
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs tests/test_[${{ matrix.group }}]*.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: pip install -r requirements-dev.txt
      - run: node tests/schema_check.mjs
      - run: node tests/db_check.mjs
      - run: node tests/roles_check.mjs
      - run: pip-audit -r requirements.txt

  backend-pg:
    # the same tests against a real Postgres server (the PGlite job above is WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        group: ["a-c", "d-l", "m-r", "s-z"]
    env:
      CI: "1"
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs tests/test_[${{ matrix.group }}]*.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
